<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تنظيم الأعراس - تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      text-decoration: none;
      box-sizing: border-box;
      text-align: center;
    }

    .btn-login { background: #2980b9; color: #fff; }
    .btn-login:hover { background: #2471a3; }

    .btn-calendar { background: #27ae60; color: #fff; }
    .btn-calendar:hover { background: #219150; }

    .btn-pass-admin { background: #8e44ad; color: #fff; }
    .btn-pass-admin:hover { background: #732d91; }

    .btn-pass-user { background: #d35400; color: #fff; }
    .btn-pass-user:hover { background: #b04100; }

    .btn-logout { background: #e74c3c; color: #fff; margin-top: 10px; }
    .btn-logout:hover { background: #c0392b; }

    .pass-box {
      display: none;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginSection">
      <h2>تسجيل الدخول</h2>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور...">
      </div>
      <button type="button" class="btn btn-login" onclick="handleLogin()">تسجيل الدخول</button>
    </div>

    <!-- 2. شاشة الداشبورد (تظهر بعد الدخول) -->
    <div id="dashboardSection" style="display: none;">
      <h2 id="welcomeMsg">أهلاً بك</h2>

      <!-- رابط مباشر لصفحة التقويم (dash.html) -->
      <a href="dash.html" class="btn btn-calendar">الدخول إلى التقويم</a>

      <!-- أزرار خاّصة بالأدمن فقط -->
      <div id="adminControls" style="display: none;">
        <button type="button" class="btn btn-pass-admin" onclick="showPassBox('admin')">تغيير كلمة سر الأدمن</button>
        <button type="button" class="btn btn-pass-user" onclick="showPassBox('user')">تغيير كلمة سر اليوزر</button>
      </div>

      <!-- مربع تغيير كلمة المرور -->
      <div id="passBox" class="pass-box">
        <h4 id="passBoxTitle" style="margin-bottom: 10px; font-size: 14px;">تغيير كلمة المرور</h4>
        <div class="form-group">
          <input type="password" id="newPasswordInput" placeholder="أدخل كلمة المرور الجديدة...">
        </div>
        <button type="button" class="btn btn-login" style="padding: 8px;" onclick="savePassword()">حفظ الكلمة الجديدة</button>
      </div>

      <!-- زر تسجيل الخروج -->
      <button type="button" class="btn btn-logout" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

  </div>

  <script>
    let activePassType = '';

    // عند فتح الصفحة نتحقق إذا كان المستخدم مسجلاً لدخوله سابقاً
    document.addEventListener("DOMContentLoaded", function () {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      if (isLoggedIn === "true") {
        renderDashboard();
      } else {
        renderLogin();
      }
    });

    // دالة تسجيل الدخول
    function handleLogin() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();

      const adminPass = localStorage.getItem("adminPass") || "admin";
      const userPass = localStorage.getItem("userPass") || "123456";

      if (user === "admin" && pass === adminPass) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", "admin");
        renderDashboard();
      } else if (user === "user" && pass === userPass) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", "user");
        renderDashboard();
      } else {
        alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
      }
    }

    // إظهار لوحة التحكم وتحديد صلاحيات الحساب
    function renderDashboard() {
      const currentUser = (localStorage.getItem("currentUser") || "").toLowerCase();
      
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("dashboardSection").style.display = "block";
      document.getElementById("welcomeMsg").innerText = "أهلاً بك: " + currentUser.toUpperCase();

      if (currentUser === "admin") {
        document.getElementById("adminControls").style.display = "block";
      } else {
        document.getElementById("adminControls").style.display = "none";
      }
      
      document.getElementById("passBox").style.display = "none";
    }

    // إظهار مربع إدخال كلمة المرور الجديدة
    function showPassBox(type) {
      activePassType = type;
      const box = document.getElementById("passBox");
      const title = document.getElementById("passBoxTitle");
      
      box.style.display = "block";
      document.getElementById("newPasswordInput").value = "";

      if (type === 'admin') {
        title.innerText = "تغيير كلمة سر الأدمن";
      } else {
        title.innerText = "تغيير كلمة سر اليوزر";
      }
    }

    // حفظ كلمة المرور الجديدة في LocalStorage
    function savePassword() {
      const newPass = document.getElementById("newPasswordInput").value.trim();
      if (!newPass) {
        alert("يرجى إدخال كلمة المرور الجديدة!");
        return;
      }

      if (activePassType === 'admin') {
        localStorage.setItem("adminPass", newPass);
        alert("تم تغيير كلمة سر الأدمن بنجاح إلى: " + newPass);
      } else if (activePassType === 'user') {
        localStorage.setItem("userPass", newPass);
        alert("تم تغيير كلمة سر اليوزر بنجاح إلى: " + newPass);
      }

      document.getElementById("passBox").style.display = "none";
    }

    // العودة لشاشة تسجيل الدخول
    function renderLogin() {
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("dashboardSection").style.display = "none";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    // تسجيل الخروج
    function handleLogout() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("currentUser");
      renderLogin();
    }
  </script>

</body>
</html>
