<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تنظيم الأعراس</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; position: relative; text-align: center; }
        .top-calendar-btn { position: absolute; top: 10px; left: 10px; background: #27ae60; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; display: none; }
        .top-calendar-btn:hover { background: #219150; }
        h2 { margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; background: #2980b9; color: #fff; border: none; padding: 10px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #2471a3; }
        .admin-dashboard { display: none; }
        .welcome-msg { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; margin-top: 25px; }
        .btn-dashboard { width: 100%; background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-dashboard:hover { background: #219150; }
        .btn-pass-admin { background: #8e44ad; }
        .btn-pass-admin:hover { background: #732d91; }
        .btn-pass-user { background: #e67e22; }
        .btn-pass-user:hover { background: #d35400; }
        .btn-logout { background: #c0392b; margin-top: 10px; }
        .btn-logout:hover { background: #a93226; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- زر الدخول للتقويم (يظهر فقط عند تسجيل الدخول كمسؤول) -->
        <button id="topCalendarBtn" class="top-calendar-btn" onclick="gotocalendar()">الدخول إلى التقويم</button>

        <!-- قسم نموذج تسجيل الدخول (الافتراضي) -->
        <div id="loginSection">
            <h2>تسجيل الدخول</h2>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>
            <button class="btn-submit" onclick="login()">دخول</button>
        </div>

        <!-- لوحة تحكم المسؤول (تظهر فقط عند تسجيل الدخول كأدمن) -->
        <div id="adminDashboard" class="admin-dashboard">
            <div class="welcome-msg">أهلاً بك في نظام تنظيم الأعراس</div>
            <button class="btn-dashboard" onclick="gotocalendar()">الانتقال إلى التقويم</button>
            <button class="btn-dashboard btn-pass-admin" onclick="changeAdminPassword()">تغيير كلمة سر المسؤول</button>
            <button class="btn-dashboard btn-pass-user" onclick="changeUserPassword()">تغيير كلمة سر المستخدم</button>
            <button class="btn-dashboard btn-logout" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // --- إعدادات الاتصال بـ Supabase ---
        const SUPABASE_URL = 'https://lgzhmamxyawldbpucxeu.supabase.co'; // ضع رابط مشروعك هنا
        const SUPABASE_ANON_KEY = 'sb_publishable_V_ZFiFCH2QD2_kLqPY9JBg_ndDdXMJ_'; // ضع مفتاح الـ Anon هنا
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // الاحتفاظ بنسخة محلية كدعم سريع للاستعلام
        if(!localStorage.getItem('adminUser')) localStorage.setItem('adminUser', 'admin');
        if(!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', '123456');
        if(!localStorage.getItem('userUser')) localStorage.setItem('userUser', 'user');
        if(!localStorage.getItem('userPass')) localStorage.setItem('userPass', '12345678');

        // التحقق عند تحميل الصفحة إذا كان مسجلاً دخول مسبقاً
        window.onload = async function() {
            await initStateSettings();
            const role = localStorage.getItem('currentUserRole');
            if (role === 'admin') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('topCalendarBtn').style.display = 'block';
            } else if (role === 'user') {
                // إذا كان المستخدم العادي مسجلاً، نقله فوراً أو أظهر له الزر
                document.getElementById('topCalendarBtn').style.display = 'block';
            }
        };

        function gotocalendar() {
            window.location.href = 'dash.html'; // توجيه لصفحة التقويم الرئيسية (dash.html)
        }

        // تهيئة البيانات الافتراضية أول مرة إذا كان الجدول فارغاً (باستخدام المفاتيح الرقمية 1 و 2)
        async function initStateSettings() {
            try {
                const { data, error } = await supabaseClient.from('settings_table').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    await supabaseClient.from('settings_table').insert([
                        { key_name: 1, val: '123456' },      // كلمة مرور الأدمن
                        { key_name: 2, val: '12345678' }    // كلمة مرور المستخدم العادي
                    ]);
                }
            } catch (e) {
                console.error('خطأ في تهيئة الإعدادات:', e);
            }
        }

        // دالة تسجيل الدخول
        async function login() {
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();

            if (!inputUser || !inputPass) {
                alert('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            try {
                // جلب القيم من قاعدة البيانات
                const { data: settings, error } = await supabaseClient
                    .from('settings_table')
                    .select('*');

                if (error) throw error;

                let adminPass = localStorage.getItem('adminPass') || '123456';
                let userPass = localStorage.getItem('userPass') || '12345678';

                if (settings && settings.length > 0) {
                    settings.forEach(row => {
                        if (row.key_name === 1 || row.key_name === '1') adminPass = row.val;
                        if (row.key_name === 2 || row.key_name === '2') userPass = row.val;
                    });
                }

                // التحقق من الصلاحيات (الأدمن: اسم المستخدم admin وكلمة السر رقم 1)
                const adminUserVal = localStorage.getItem('adminUser') || 'admin';
                const userUserVal = localStorage.getItem('userUser') || 'user';

                if (inputUser === adminUserVal && inputPass === adminPass) {
                    localStorage.setItem('currentUserRole', 'admin');
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    document.getElementById('topCalendarBtn').style.display = 'block';
                } else if (inputUser === userUserVal && inputPass === userPass) {
                    localStorage.setItem('currentUserRole', 'user');
                    window.location.href = 'dash.html';
                } else {
                    alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
                }
            } catch (e) {
                console.error('خطأ أثناء تسجيل الدخول:', e);
                alert('حدث خطأ في الاتصال بالسحاب!');
            }
        }

        function logout() {
            localStorage.removeItem('currentUserRole');
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('topCalendarBtn').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // دالة تغيير كلمة سر المسؤول (تتحدث مع المفتاح رقم 1)
        async function changeAdminPassword() {
            const currentPass = prompt('أدخل كلمة سر المسؤول الحالية:');
            if (currentPass === null) return;

            let adminPassStored = localStorage.getItem('adminPass') || '123456';
            
            try {
                const { data } = await supabaseClient.from('settings_table').select('*').eq('key_name', 1).single();
                if (data) adminPassStored = data.val;
            } catch (err) {}

            if (currentPass !== adminPassStored) {
                alert('كلمة المرور غير صحيحة!');
                return;
            }

            const newPass = prompt('أدخل كلمة سر المسؤول الجديدة:');
            if (newPass && newPass.trim() !== '') {
                localStorage.setItem('adminPass', newPass);
                const { error } = await supabaseClient
                    .from('settings_table')
                    .update({ val: newPass })
                    .eq('key_name', 1);

                if (error) {
                    alert('حدث خطأ أثناء التحديث السحابي: ' + error.message);
                } else {
                    alert('تم تغيير كلمة سر المسؤول بنجاح!');
                }
            }
        }

        // دالة تغيير كلمة سر المستخدم العادي (تتحدث مع المفتاح رقم 2)
        async function changeUserPassword() {
            const adminCheck = prompt('هذا الإجراء يتطلب صلاحية المسؤول. أدخل كلمة سر المسؤول للتأكيد:');
            if (adminCheck === null) return;

            let adminPassStored = localStorage.getItem('adminPass') || '123456';
            try {
                const { data } = await supabaseClient.from('settings_table').select('*').eq('key_name', 1).single();
                if (data) adminPassStored = data.val;
            } catch (err) {}

            if (adminCheck !== adminPassStored) {
                alert('كلمة سر المسؤول غير صحيحة!');
                return;
            }

            const newPass = prompt('أدخل كلمة سر المستخدم الجديدة:');
            if (newPass && newPass.trim() !== '') {
                localStorage.setItem('userPass', newPass);
                const { error } = await supabaseClient
                    .from('settings_table')
                    .update({ val: newPass })
                    .eq('key_name', 2);

                if (error) {
                    alert('حدث خطأ أثناء التحديث السحابي: ' + error.message);
                } else {
                    alert('تم تغيير كلمة سر المستخدم بنجاح!');
                }
            }
        }
    </script>
</body>
</html>
