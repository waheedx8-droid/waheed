<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام تنظيم الأعراس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      position: relative;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #2471a3;
    }

    .admin-dashboard {
      display: none;
    }

    .welcome-msg {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .btn-dashboard {
      display: block;
      width: 100%;
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-decoration: none;
      text-align: center;
    }

    .btn-dashboard:hover {
      background: #219150;
    }

    .btn-pass-admin {
      display: block;
      width: 100%;
      background: #8e44ad;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      text-decoration: none;
      text-align: center;
    }

    .btn-pass-admin:hover {
      background: #732d91;
    }

    .btn-pass-user {
      display: block;
      width: 100%;
      background: #d35400;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      text-decoration: none;
      text-align: center;
    }

    .btn-pass-user:hover {
      background: #b04100;
    }

    .btn-logout {
      width: 100%;
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-logout:hover {
      background: #c0392b;
    }

    .pass-change-section {
      display: none;
      margin-top: 15px;
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div id="loginSection">
      <h2>تسجيل الدخول</h2>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور...">
      </div>
      <button type="button" class="btn-submit" onclick="handleLogin()">تسجيل الدخول</button>
    </div>

    <div id="adminDashboard" class="admin-dashboard">
      <div class="welcome-msg" id="welcomeMsg">لوحة التحكم</div>

      <button type="button" class="btn-dashboard" onclick="goToCalendar()">التقويم</button>

      <button type="button" class="btn-pass-admin" id="adminPassBtn" onclick="togglePassSection('admin')">تغيير كلمة مرور الأدمن</button>
      <button type="button" class="btn-pass-user" id="userPassBtn" onclick="togglePassSection('user')">تغيير كلمة مرور المستخدم</button>

      <div id="passChangeSection" class="pass-change-section">
        <h3 id="passSectionTitle" style="font-size:15px; margin-bottom:10px; color:#333;">تغيير كلمة المرور</h3>
        <div class="form-group">
          <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة...">
        </div>
        <button type="button" class="btn-submit" onclick="saveNewPassword()">حفظ كلمة المرور</button>
      </div>

      <button type="button" class="btn-logout" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

  </div>

  <script>
    let targetAccountToChange = '';

    // التحقق من الجلسة عند فتح التطبيق
    document.addEventListener("DOMContentLoaded", function () {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      if (isLoggedIn === "true") {
        showDashboard();
      } else {
        showLogin();
      }
    });

    // دالة التحويل المباشر لصفحة التقويم (تمنع إعادة التحميل نهائياً)
    function goToCalendar() {
      window.location.href = "calendar.html";
    }

    // دالة تسجيل الدخول
    function handleLogin() {
      const userVal = document.getElementById("username").value.trim().toLowerCase();
      const passVal = document.getElementById("password").value.trim();

      const savedAdminPass = localStorage.getItem("adminPass") || "admin";
      const savedUserPass = localStorage.getItem("userPass") || "123456";

      if (userVal === "admin" && passVal === savedAdminPass) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", "admin");
        showDashboard();
      } else if (userVal === "user" && passVal === savedUserPass) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", "user");
        showDashboard();
      } else {
        alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
      }
    }

    // إظهار لوحة التحكم وتخصيص الأزرار حسب الحساب
    function showDashboard() {
      const currentUser = (localStorage.getItem("currentUser") || "").toLowerCase();
      document.getElementById("welcomeMsg").innerText = "أهلاً بك: " + currentUser.toUpperCase();

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";

      // إذا كان الحساب أدمين تظهر أزرار كلمة المرور، وإذا كان يوزر تخفي تماماً
      if (currentUser === "admin") {
        document.getElementById("adminPassBtn").style.display = "block";
        document.getElementById("userPassBtn").style.display = "block";
      } else {
        document.getElementById("adminPassBtn").style.display = "none";
        document.getElementById("userPassBtn").style.display = "none";
      }
    }

    function togglePassSection(type) {
      targetAccountToChange = type;
      const section = document.getElementById("passChangeSection");
      const title = document.getElementById("passSectionTitle");

      section.style.display = "block";
      if (type === 'admin') {
        title.innerText = "تغيير كلمة مرور الأدمن";
      } else {
        title.innerText = "تغيير كلمة مرور المستخدم";
      }
    }

    function saveNewPassword() {
      const newPass = document.getElementById("newPassword").value.trim();
      if (!newPass) {
        alert("يرجى إدخال كلمة المرور الجديدة");
        return;
      }

      if (targetAccountToChange === 'admin') {
        localStorage.setItem("adminPass", newPass);
        alert("تم تغيير كلمة مرور الأدمن بنجاح!");
      } else {
        localStorage.setItem("userPass", newPass);
        alert("تم تغيير كلمة مرور المستخدم بنجاح!");
      }

      document.getElementById("newPassword").value = "";
      document.getElementById("passChangeSection").style.display = "none";
    }

    function showLogin() {
      document.getElementById("adminDashboard").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    function handleLogout() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("currentUser");
      showLogin();
    }
  </script>

</body>
</html>
