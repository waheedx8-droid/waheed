<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام تنظيم الأعراس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; position: relative; text-align: center; }
    
    h2 { margin-bottom: 20px; color: #2c3e50; }
    .form-group { margin-bottom: 15px; text-align: right; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
    .btn-submit { width: 100%; background: #2980b9; color: #fff; border: none; padding: 10px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #2471a3; }

    /* لوحة التحكم والأزرار الداخلية */
    .admin-dashboard { display: none; }
    .welcome-msg { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
    
    .btn-dashboard { display: block; width: 100%; background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; text-decoration: none; text-align: center; }
    .btn-dashboard:hover { background: #219150; }
    
    .btn-logout { width: 100%; background: #e74c3c; color: #fff; border: none; padding: 10px; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-logout:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div class="login-card">
    
    <div id="loginSection">
      <h2>تسجيل الدخول</h2>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور...">
      </div>
      <button type="button" class="btn-submit" onclick="handleLogin()">تسجيل الدخول</button>
    </div>

    <div id="adminDashboard" class="admin-dashboard">
      <div class="welcome-msg" id="welcomeMsg">أهلاً بك في اللوحة</div>
      
      <a href="calendar.html" class="btn-dashboard">التقويم</a>
      
      <button type="button" class="btn-logout" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

  </div>

  <script>
    // عند فتح التطبيق: التحقق من الجلسة الحالية أو عرض شاشة الدخول تلقائياً
    document.addEventListener("DOMContentLoaded", function () {
      const isLoggedIn = sessionStorage.getItem("isLoggedIn");
      if (isLoggedIn === "true") {
        showDashboard();
      } else {
        showLogin();
      }
    });

    // دالة تسجيل الدخول
    function handleLogin() {
      const userVal = document.getElementById("username").value.trim().toLowerCase();
      const passVal = document.getElementById("password").value.trim();

      // القبول بحساب admin أو user
      if (userVal === "admin" || userVal === "user") {
        // حفظ الجلسة مؤقتاً في sessionStorage لكي تنتهي فور إغلاق التطبيق
        sessionStorage.setItem("isLoggedIn", "true");
        sessionStorage.setItem("currentUser", userVal);

        showDashboard();
      } else {
        alert("اسم المستخدم أو كلمة المرور غير صحيحة");
      }
    }

    // إظهار لوحة التحكم
    function showDashboard() {
      const user = sessionStorage.getItem("currentUser") || "";
      document.getElementById("welcomeMsg").innerText = "أهلاً بك: " + user.toUpperCase();
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";
    }

    // إظهار شاشة الدخول
    function showLogin() {
      document.getElementById("adminDashboard").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    // دالة تسجيل الخروج اليمني
    function handleLogout() {
      sessionStorage.clear();
      showLogin();
    }

    // إنهاء الجلسة فور إغلاق التطبيق/النافذة
    window.addEventListener("beforeunload", function () {
      sessionStorage.clear();
    });
  </script>

</body>
</html>
