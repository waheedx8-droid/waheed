<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الحجوزات - نظام تنظيم الأعراس</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fef2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 10px; }
        
        .calendar-container { 
            width: 100%; 
            max-width: 480px; 
            background: #fff; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .calendar-header h2 { font-size: 18px; color: #2c3e50; }
        
        .header-buttons { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn-nav { background: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-nav:hover { background: #2980b9; }
        .logout { background: #e74c3c; }
        .logout:hover { background: #c0392b; }
        
        .user-tag { background: #2c3e50; color: white; padding: 6px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* شبكة التقويم */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 4px; 
            width: 100%;
        }
        
        .day-header { 
            font-weight: bold; 
            font-size: 11px; 
            background: #f8f9fa; 
            padding: 6px 2px; 
            text-align: center; 
            border-radius: 4px;
            color: #2c3e50;
        }
        
        .day-cell { 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            border-radius: 4px; 
            min-height: 75px; 
            display: flex; 
            flex-direction: column; 
            text-align: right; 
            position: relative; 
            padding: 2px;
        }
        
        .day-number { 
            font-weight: bold; 
            font-size: 12px; 
            text-align: left; 
            padding: 2px 4px; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 2px; 
            color: #333;
        }
        
        .btn-add-mini { 
            background: #2980b9; 
            color: white; 
            border: none; 
            border-radius: 3px; 
            padding: 2px; 
            font-size: 10px; 
            cursor: pointer; 
            text-align: center; 
            display: block; 
            width: 100%; 
            text-decoration: none; 
            margin-top: auto;
        }
        .btn-add-mini:hover { background: #2471a3; }

        .booking-badge { 
            font-size: 9px; 
            padding: 2px 4px; 
            margin-bottom: 2px; 
            border-radius: 3px; 
            color: #fff; 
            display: block; 
            text-decoration: none; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .badge-approved { background: #27ae60; }
        .badge-pending { background: #e67e22; }

        .badge-groom { font-weight: bold; display: block; }
        .badge-hall { font-size: 8px; opacity: 0.9; display: block; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h2 id="monthYearDisplay"></h2>
            <div class="header-buttons">
                <button class="btn-nav" onclick="changeMonth(-1)">الشهر السابق</button>
                <button class="btn-nav" onclick="changeMonth(1)">الشهر التالي</button>
                <span id="roleDisplay" class="user-tag">user</span>
                <button class="btn-nav logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarDays">
            <!-- أيام الأسبوع -->
            <div class="day-header">الأحد</div>
            <div class="day-header">الإثنين</div>
            <div class="day-header">الثلاثاء</div>
            <div class="day-header">الأربعاء</div>
            <div class="day-header">الخميس</div>
            <div class="day-header">الجمعة</div>
            <div class="day-header">السبت</div>
        </div>
    </div>

    <script>
        // --- إعدادات الاتصال بـ Supabase ---
        const SUPABASE_URL = 'https://lgzhmamxyawldbpucxeu.supabase.co'; // ضع رابط مشروعك هنا
        const SUPABASE_ANON_KEY = 'sb_publishable_V_ZFiFCH2QD2_kLqPY9JBg_ndDdXMJ_'; // ضع مفتاح الـ Anon هنا
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const monthNames = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        let currentDate = new Date(); 
        const currentUserRole = localStorage.getItem('currentUserRole') || 'user';
        document.getElementById('roleDisplay').textContent = currentUserRole === 'admin' ? 'مدير النظام (admin)' : 'مستخدم (user)';

        let allBookingsMap = {};

        async function initCalendarSystem() {
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('bookings_table').select('*');
                    if (!error && data) {
                        allBookingsMap = {};
                        data.forEach(item => {
                            const dateKey = item.booking_date;
                            if (!allBookingsMap[dateKey]) allBookingsMap[dateKey] = [];
                            allBookingsMap[dateKey].push({
                                id: item.id,
                                groomName: item.groom_name,
                                hallName: item.hall_name,
                                status: item.status || 'pending'
                            });
                        });
                    }
                }
            } catch (e) {
                console.error('خطأ في جلب الحجوزات من Supabase:', e);
                loadLocalStorageFallback();
            }
            renderCalendar();
        }

        function loadLocalStorageFallback() {
            const localData = JSON.parse(localStorage.getItem('allBookings')) || {};
            formatBookingsData(localData);
        }

        function formatBookingsData(rawObj) {
            allBookingsMap = {};
            for (let dateKey in rawObj) {
                const val = rawObj[dateKey];
                if (Array.isArray(val)) {
                    allBookingsMap[dateKey] = val.map(b => ({
                        id: b.id || Math.random(),
                        groomName: b.groom_name || b.groomName || 'حجز',
                        hallName: b.hall_name || b.hallName || 'صالة',
                        status: b.status || 'pending'
                    }));
                }
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const monthIndex = currentDate.getMonth();
            const monthNumber = monthIndex + 1;

            const headerText = `${monthNames[monthIndex]} (${monthNumber}) - ${year}`;
            document.getElementById('monthYearDisplay').innerHTML = headerText;

            const daysContainer = document.getElementById('calendarDays');
            
            const headersHTML = `
                <div class="day-header">الأحد</div>
                <div class="day-header">الإثنين</div>
                <div class="day-header">الثلاثاء</div>
                <div class="day-header">الأربعاء</div>
                <div class="day-header">الخميس</div>
                <div class="day-header">الجمعة</div>
                <div class="day-header">السبت</div>
            `;
            daysContainer.innerHTML = headersHTML;

            const firstDayIndex = new Date(year, monthIndex, 1).getDay();
            const totalDays = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell';
                emptyCell.style.background = '#fcfcfc';
                emptyCell.style.border = 'none';
                daysContainer.appendChild(emptyCell);
            }

           for (let day = 1; day <= totalDays; day++) {
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';

        const formattedMonth = String(monthNumber).padStart(2, '0');
        const formattedDay = String(day).padStart(2, '0');
        const fullDatestr = `${year}-${formattedMonth}-${formattedDay}`;

        let cellContent = `<div class="day-number">${day}</div>`;

        if (allBookingsMap[fullDatestr] && allBookingsMap[fullDatestr].length > 0) {
            dayCell.style.cursor = 'pointer';
            dayCell.onclick = () => openModal(fullDatestr, allBookingsMap[fullDatestr]);
            
            const bookingsList = allBookingsMap[fullDatestr];
            bookingsList.forEach(booking => {
                const statusClass = booking.status === 'approved' ? 'badge-approved' : 'badge-pending';
                cellContent += `
                    <div class="booking-badge ${statusClass}">
                        <span class="badge-groom">🤵 ${booking.groomName}</span>
                        <span class="badge-hall">📍 ${booking.hallName}</span>
                    </div>
                `;
            });
        }

        cellContent += `<a href="contract.html?date=${fullDatestr}" class="btn-add-mini" onclick="event.stopPropagation()">+ إضافة</a>`;
        
        dayCell.innerHTML = cellContent;
        daysContainer.appendChild(dayCell);
    }
        }
        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function logout() {
            localStorage.removeItem('currentUserRole');
            window.location.href = 'index.html';
        }

        initCalendarSystem();
        function openModal(dateStr, bookings) {
            document.getElementById('modalDateTitle').textContent = `حجوزات تاريخ: ${dateStr}`;
            
            let listHTML = '';
            bookings.forEach(b => {
                const badgeColor = b.status === 'approved' ? '#27ae60' : '#e67e22';
                listHTML += `
                    <div style="background:#f9f9f9; border:1px solid #ddd; padding:10px; border-radius:5px; margin-bottom:8px;">
                        <p style="margin:0 0 5px 0;"><strong>العريس:</strong> ${b.groomName}</p>
                        <p style="margin:0 0 5px 0;"><strong>الصالة:</strong> ${b.hallName}</p>
                        <a href="contract.html?id=${b.id}&date=${dateStr}" style="display:inline-block; background:${badgeColor}; color:#fff; padding:4px 8px; border-radius:3px; text-decoration:none; font-size:12px; margin-top:5px;">عرض تفاصيل العقد</a>
                    </div>
                `;
            });
            
            document.getElementById('modalBookingsList').innerHTML = listHTML;
            document.getElementById('modalAddBtn').href = `contract.html?date=${dateStr}`;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
        }
    </script>
    <!-- القائمة المنبثقة (Modal) لعرض تفاصيل الحجوزات -->
<div id="bookingModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; text-align:right; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
        <h3 id="modalDateTitle" style="margin-bottom:15px; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:8px;"></h3>
        <div id="modalBookingsList" style="max-height:250px; overflow-y:auto; margin-bottom:15px;"></div>
        <div style="display:flex; gap:10px; justify-content:space-between;">
            <a id="modalAddBtn" href="#" class="btn-nav" style="text-align:center; flex:1; text-decoration:none; background:#27ae60;">+ إضافة عقد جديد</a>
            <button onclick="closeModal()" class="btn-nav logout" style="cursor:pointer;">إغلاق</button>
        </div>
    </div>
</div>
</body>
</html>
