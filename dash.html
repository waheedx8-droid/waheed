<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الحجوزات والعقود</title>
    <!-- تضمين مكتبات Supabase و FontAwesome و Google Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            direction: rtl;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        /* زر الإشعارات والنافذة المنسدلة */
        .notification-bell {
            position: relative;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }
        .notification-bell:hover {
            background: rgba(255,255,255,0.2);
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #e74c3c;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }
        .notifications-dropdown {
            position: absolute;
            top: 50px;
            left: 0;
            width: 320px;
            background: white;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .notifications-header {
            background: #f8f9fa;
            padding: 10px 15px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notifications-body {
            max-height: 300px;
            overflow-y: auto;
        }
        .notification-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f1f1f1;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notification-item:hover {
            background: #f8f9fa;
        }
        .notification-item.unread {
            background: #ebf5fb;
            font-weight: 600;
        }
        .notification-time {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        /* حاوية التقويم الرئيسية */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .calendar-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .calendar-header h2 {
            font-size: 20px;
            color: #2c3e50;
        }
        .nav-btn {
            background: #ecf0f1;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #2c3e50;
            transition: 0.3s;
        }
        .nav-btn:hover {
            background: #3498db;
            color: white;
        }

        /* شبكة أيام التقويم */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f8f9fa;
            font-weight: bold;
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: #7f8c8d;
            font-size: 14px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, auto);
        }
        .day-cell {
            border-bottom: 1px solid #eee;
            border-left: 1px solid #eee;
            padding: 8px;
            background: #fff;
            position: relative;
            transition: background 0.2s;
        }
        .day-cell:nth-child(7n) {
            border-left: none;
        }
        .day-cell:hover {
            background: #fdfefe;
        }
        .day-cell.other-month {
            background: #fafafa;
            color: #bdc3c7;
        }
        .day-number {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
            width: 26px;
            height: 26px;
            text-align: center;
            line-height: 26px;
            border-radius: 50%;
        }
        .day-cell.today .day-number {
            background-color: #3498db;
            color: white;
        }

        /* قائمة الحجوزات داخل الخلية */
        .bookings-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 80px;
            overflow-y: auto;
        }
        .booking-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .booking-badge:hover {
            transform: scale(1.02);
        }

        /* النافذة المنبثقة (Popup) للتنبيهات الفورية */
        #alert-modal {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            max-width: 350px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #alert-modal h4 {
            margin-bottom: 5px;
            font-size: 15px;
            color: #3498db;
        }
        #alert-modal p {
            font-size: 13px;
            color: #ecf0f1;
        }

        /* تصميم متجاوب للشاشات الصغيرة */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .days-grid {
                grid-auto-rows: minmax(80px, auto);
            }
            .day-cell {
                padding: 4px;
            }
            .booking-badge {
                font-size: 9px;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-calendar-days"></i> تقويم الحجوزات والعقود</h1>
        <div class="header-actions">
            <!-- زر الإشعارات (للآدمن فقط أو حسب الصلاحية) -->
            <div class="notification-bell" id="notificationBell" onclick="toggleNotificationsDropdown()" title="الإشعارات">
                <i class="fa-solid fa-bell"></i>
                <span class="notification-badge" id="notificationCount" style="display: none;">0</span>
                
                <div class="notifications-dropdown" id="notificationsDropdown" onclick="event.stopPropagation()">
                    <div class="notifications-header">
                        <span>الإشعارات الفورية</span>
                        <span style="font-size: 11px; cursor: pointer; color: #3498db;" onclick="markAllAsRead()">تحديد الكل مقروء</span>
                    </div>
                    <div class="notifications-body" id="notificationsList">
                        <div style="padding: 15px; text-align: center; color: #888; font-size: 12px;">لا توجد إشعارات جديدة</div>
                    </div>
                </div>
            </div>

            <a href="index.html" class="btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <button class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</button>
        </div>
    </header>

    <div class="container">
        <div class="calendar-card">
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-right"></i></button>
                <h2 id="monthYearDisplay">الشهر والسنة</h2>
                <button class="nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
            
            <div class="weekdays">
                <div>الأحد</div>
                <div>الإثنين</div>
                <div>الثلاثاء</div>
                <div>الأربعاء</div>
                <div>الخميس</div>
                <div>الجمعة</div>
                <div>السبت</div>
            </div>
            
            <div class="days-grid" id="daysGrid">
                <!-- الأيام تتولد ديناميكياً عبر JavaScript -->
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة للتنبيهات الفورية على الشاشة -->
    <div id="alert-modal">
        <h4 id="alertModalTitle">تنبيه جديد</h4>
        <p id="alertModalText">هناك تحديث جديد في الحجوزات.</p>
    </div>

    <!-- عنصر صوت التنبيه (يصدر تنبيهاً صوتياً خفيفاً عند حدوث تغيير) -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // المتغيرات العامة للتقويم والنظام
        let currentDate = new Date();
        let supabaseClient = null;
        let allBookingsMap = {};
        let lastBookingsCount = 0;
        let lastBookingsStateJSON = "";
        let currentUserRole = 'user'; // افتراضي، يتم تحديثه من الجلسة

        // تهيئة Supabase وبيانات الاعتماد (تأكد من مطابقتها لبيانات مشروعك)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        document.addEventListener("DOMContentLoaded", () => {
            // محاولة تهيئة عميل Supabase
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            
            // قراءة دور المستخدم الحالي من التخزين المحلي إن توفر
            const sessionData = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (sessionData) {
                try {
                    const parsed = JSON.parse(sessionData);
                    currentUserRole = parsed.role || 'user';
                } catch(e) {}
            }

            initCalendarSystem(false);

            // تفعيل التحقق الخلفي الدورى (Polling) كل 10 ثوانٍ كضمان إضافي للـ Realtime
            setInterval(() => {
                initCalendarSystem(true);
            }, 10000);

            // إغلاق قائمة الإشعارات عند النقر في أي مكان خارجها
            document.addEventListener('click', () => {
                const dropdown = document.getElementById('notificationsDropdown');
                if (dropdown) dropdown.style.display = 'none';
            });
        });

        // دالة تبديل إظهار/إخفاء قائمة الإشعارات المنسدلة
        function toggleNotificationsDropdown() {
            event.stopPropagation();
            const dropdown = document.getElementById('notificationsDropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // جلب الإشعارات من قاعدة البيانات (إن وجدت جدول إشعارات أو سيتم استخدام الذاكرة المؤقتة)
        async function fetchNotifications() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('system_notifications')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);

                if (!error && data) {
                    renderNotificationsUI(data);
                }
            } catch (e) {
                console.log("جدول الإشعارات غير مفعل أو غير موجود، يتم استخدام التنبيهات المحلية.");
            }
        }

        // عرض الإشعارات في الواجهة
        function renderNotificationsUI(notifications) {
            const listEl = document.getElementById('notificationsList');
            const countEl = document.getElementById('notificationCount');
            if (!listEl) return;

            if (notifications.length === 0) {
                listEl.innerHTML = `<div style="padding: 15px; text-align: center; color: #888; font-size: 12px;">لا توجد إشعارات جديدة</div>`;
                if (countEl) countEl.style.display = 'none';
                return;
            }

            let unreadCount = notifications.filter(n => !n.is_read).length;
            if (countEl) {
                if (unreadCount > 0) {
                    countEl.innerText = unreadCount;
                    countEl.style.display = 'inline-block';
                } else {
                    countEl.style.display = 'none';
                }
            }

            let html = '';
            notifications.forEach(n => {
                let timeStr = new Date(n.created_at || Date.now()).toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});
                html += `
                    <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="handleNotificationClick('${n.id}', '${n.link || ''}')">
                        <div><strong>${n.title}</strong></div>
                        <div style="color: #555; margin-top: 2px;">${n.message}</div>
                        <div class="notification-time">${timeStr}</div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // إنشاء إشعار جديد في النظام وإرساله لقاعدة البيانات
        async function createSystemNotification(title, message, link = '') {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('system_notifications').insert([{
                    title: title,
                    message: message,
                    link: link,
                    is_read: false,
                    created_at: new Date().toISOString()
                }]);
                fetchNotifications();
            } catch (e) {
                console.error("خطأ في حفظ الإشعار:", e);
            }
        }

        // التعامل مع النقر على إشعار
        async function handleNotificationClick(id, link) {
            if (supabaseClient) {
                await supabaseClient.from('system_notifications').update({ is_read: true }).eq('id', id);
            }
            if (link) {
                window.location.href = link;
            } else {
                fetchNotifications();
            }
        }

        // تحديد كل الإشعارات كمقروءة
        async function markAllAsRead() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('system_notifications').update({ is_read: true }).eq('is_read', false);
                fetchNotifications();
            } catch(e) {}
        }

        // تشغيل التنبيه البصري (Popup) والصوتي
        function triggerNewBookingAlert(title, message) {
            const modal = document.getElementById('alert-modal');
            const titleEl = document.getElementById('alertModalTitle');
            const textEl = document.getElementById('alertModalText');
            const audio = document.getElementById('alertSound');

            if (titleEl) titleEl.innerText = title;
            if (textEl) textEl.innerText = message;
            
            if (modal) {
                modal.style.display = 'block';
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 6000);
            }

            if (audio) {
                audio.play().catch(err => console.log("تم حظر التشغيل التلقائي للصوت من المتصفح"));
            }
        }

        // جلب الحجوزات وتفعيل نظام الـ Realtime والتحقق الخلفي الشامل
        async function initCalendarSystem(isBackgroundCheck = false) {
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('bookings_table').select('*');
                    if (!error && data) {
                        const currentStateJSON = JSON.stringify(data);

                        // التحقق الخلفي في حال حدوث تغييرات خارجية
                        if (isBackgroundCheck && lastBookingsStateJSON !== "" && currentStateJSON !== lastBookingsStateJSON) {
                            let title = "📝 تحديث في العقود/المسودات";
                            let msg = "قام مستخدم بتعديل أو حفظ مسودة أو حجز في النظام.";
                            triggerNewBookingAlert(title, msg);
                            await createSystemNotification(title, msg);
                        }

                        lastBookingsCount = data.length;
                        lastBookingsStateJSON = currentStateJSON;

                        allBookingsMap = {};
                        data.forEach(item => {
                            if (!item.booking_date) return;
                            let rawDate = item.booking_date.toString().trim().split('T')[0];
                            let dateParts = rawDate.split('-');
                            let dateKey = rawDate;
                            if (dateParts.length === 3) {
                                const pYear = dateParts[0];
                                const pMonth = String(dateParts[1]).padStart(2, '0');
                                const pDay = String(dateParts[2]).padStart(2, '0');
                                dateKey = `${pYear}-${pMonth}-${pDay}`;
                            }
                            if (!allBookingsMap[dateKey]) allBookingsMap[dateKey] = [];
                            
                            // تحديد اللون: إذا كانت مسودة تكون باللون الفضي تلقائياً
                            let finalColor = item.box_color || '#27ae60';
                            let isDraft = (item.status === 'pending' || !item.status);
                            if (isDraft) {
                                finalColor = '#95a5a6'; // اللون الفضي للمسودات
                            }
                            allBookingsMap[dateKey].push({
                                id: item.id,
                                groomName: item.groom_name,
                                hallName: item.hall_name,
                                status: item.status || 'pending',
                                boxColor: finalColor
                            });
                        });
                    }
                }
            } catch (e) {
                console.error('خطأ في جلب الحجوزات:', e);
            }
            renderCalendar();
            
            // ==========================================
            // تفعيل نظام الاستماع الفوري (Realtime) المحدث
            // ==========================================
            if (supabaseClient && !window.realtimeInitialized) {
                window.realtimeInitialized = true;
                supabaseClient
                  .channel('public:bookings_table')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings_table' }, async payload => {
                      let eventType = payload.eventType;
                      let newData = payload.new || payload.old;
                      let groom = newData ? (newData.groom_name || 'بدون اسم') : 'عقد';
                      let bookingDate = newData ? newData.booking_date : '';

                      let title = "";
                      let msg = "";

                      if (eventType === 'INSERT') {
                          title = "📝 تم حفظ مسودة جديدة (باللون الفضي)";
                          msg = `قام المستخدم بحفظ عقد جديد للعريس (${groom}) كـ مسودة.`;
                      } else if (eventType === 'UPDATE') {
                          title = "🔄 تم تعديل أو نقل مسودة/عقد";
                          msg = `قام المستخدم بتعديل أو نقل عقد العريس (${groom}) وأصبح باللون الفضي/مسودة.`;
                      } else if (eventType === 'DELETE') {
                          title = "🗑️ تم حذف عقد";
                          msg = `تم حذف عقد من النظام.`;
                      }

                      if (title) {
                          // تشغيل التنبيه والصوت فوراً للآدمن
                          triggerNewBookingAlert(title, msg);
                          // حفظ الإشعار في قاعدة البيانات
                          await createSystemNotification(title, msg, `calendar.html?jumpDate=${bookingDate}`);
                      }

                      initCalendarSystem(false);
                  })
                  .subscribe();
            }

            if (currentUserRole === 'admin') {
                fetchNotifications();
            }

            // فحص الانتقال المباشر لتاريخ محدد عبر الـ URL
            const urlParams = new URLSearchParams(window.location.search);
            const jumpDate = urlParams.get('jumpDate');
            if (jumpDate) {
                window.history.replaceState({}, document.title, window.location.pathname);
                setTimeout(() => {
                    const [bYear, bMonth, bDay] = jumpDate.split('-').map(Number);
                    currentDate = new Date(bYear, bMonth - 1, 1);
                    renderCalendar();
                }, 100);
            }
        }

        // رسم وترتيب التقويم الشهري
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["يناير (1)", "فبراير (2)", "مارس (3)", "أبريل (4)", "مايو (5)", "يونيو (6)", "يوليو (7)", "أغسطس (8)", "سبتمبر (9)", "كتوبر (10)", "نوفمبر (11)", "ديسمبر (12)"];
            const displayEl = document.getElementById('monthYearDisplay');
            if (displayEl) {
                displayEl.innerText = `${monthNames[month]} ${year}`;
            }

            const daysGrid = document.getElementById('daysGrid');
            if (!daysGrid) return;
            daysGrid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            const today = new Date();
            const isCurrentMonthYear = (today.getFullYear() === year && today.getMonth() === month);

            let htmlContent = '';

            // أيام الشهر السابق المكملة للسطر الأول
            for (let i = firstDayIndex; i > 0; i--) {
                let pDay = prevTotalDays - i + 1;
                htmlContent += `<div class="day-cell other-month"><span class="day-number">${pDay}</span></div>`;
            }

            // أيام الشهر الحالي
            for (let d = 1; d <= totalDays; d++) {
                let mFormatted = String(month + 1).padStart(2, '0');
                let dFormatted = String(d).padStart(2, '0');
                let dateKey = `${year}-${mFormatted}-${dFormatted}`;

                let isToday = (isCurrentMonthYear && today.getDate() === d);
                let dayClass = `day-cell ${isToday ? 'today' : ''}`;

                let bookingsHtml = '';
                if (allBookingsMap[dateKey] && allBookingsMap[dateKey].length > 0) {
                    bookingsHtml = `<div class="bookings-container">`;
                    allBookingsMap[dateKey].forEach(b => {
                        let titleText = `${b.groomName || 'بدون اسم'} (${b.hallName || 'بدون قاعة'})`;
                        bookingsHtml += `<div class="booking-badge" style="background-color: ${b.boxColor};" title="${titleText}" onclick="openBookingDetails('${b.id}')">${b.groomName || 'عقد'}</div>`;
                    });
                    bookingsHtml += `</div>`;
                }

                htmlContent += `
                    <div class="${dayClass}">
                        <span class="day-number">${d}</span>
                        ${bookingsHtml}
                    </div>
                `;
            }

            // أيام الشهر التالي لإكمال الشبكة
            const totalCellsSoFar = firstDayIndex + totalDays;
            const remainingCells = (totalCellsSoFar % 7 === 0) ? 0 : (7 - (totalCellsSoFar % 7));
            for (let n = 1; n <= remainingCells; n++) {
                htmlContent += `<div class="day-cell other-month"><span class="day-number">${n}</span></div>`;
            }

            daysGrid.innerHTML = htmlContent;
        }

        // التنقل بين الأشهر بالسابق والتالي
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // فتح تفاصيل الحجوزات عند النقر على البادج
        function openBookingDetails(bookingId) {
            // توجيه المستخدم لصفحة تعديل العقد أو عرض التفاصيل الخاصة بالمعرف
            window.location.href = `index.html?edit_id=${bookingId}`;
        }

        // تسجيل الخروج العادي
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
