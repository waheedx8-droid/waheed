<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الحجوزات - نظام تنظيم الأعراس</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #fef2f5; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            padding: 5px; 
            touch-action: pan-y; 
            overflow-x: hidden; 
        }
        .calendar-container { 
            width: 100% !important; 
            max-width: 100% !important; 
            margin: 0 auto;
            background: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            position: relative;
            overflow-x: hidden;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .calendar-header h2 { font-size: 17px; color: #2c3e50; }
        .header-buttons { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; width: 100%; position: relative; }
        .btn-nav { background: #3498db; color: white; border: none; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-nav:hover { background: #2980b9; }
        .logout { background: #e74c3c; }
        .logout:hover { background: #c0392b; }
        .user-tag { background: #2c3e50; color: white; padding: 4px 6px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        
        .notification-container { position: relative; display: inline-block; }
        .notification-badge-count { position: absolute; top: -5px; right: -5px; background: #e74c3c; color: white; border-radius: 50%; padding: 2px 5px; font-size: 9px; font-weight: bold; }
        
        .notification-dropdown { 
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: auto; 
            background: #fff; 
            width: 250px; 
            max-width: 85vw; 
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2); 
            z-index: 9999; 
            border-radius: 6px; 
            padding: 8px; 
            text-align: right; 
            border: 1px solid #ddd;
            margin-top: 5px;
        }
        .notification-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; cursor: pointer; color: #333; word-break: break-word; }
        .notification-item:hover { background: #f1f1f1; }
        .notification-item.unread { font-weight: bold; background: #fdf2e9; }
        
        #soundToggleBtn {
            background: #8e44ad !important;
            animation: pulse 1.2s infinite;
            font-size: 12px !important;
            padding: 8px 12px !important;
            display: none;
            color: #fff;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 68, 173, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(142, 68, 173, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 68, 173, 0); }
        }

        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, minmax(0, 1fr)); 
            gap: 2px; 
            width: 100%;
        }
        .day-header { 
            font-weight: bold; 
            font-size: 10.5px; 
            background: #f8f9fa; 
            padding: 5px 1px; 
            text-align: center; 
            border-radius: 4px;
            color: #2c3e50;
        }
        .day-cell { 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            border-radius: 4px; 
            min-height: 85px; 
            display: flex; 
            flex-direction: column; 
            text-align: right; 
            position: relative; 
            padding: 2px; 
            cursor: pointer; 
            overflow: hidden;
        }
        .day-number { 
            font-weight: bold; 
            font-size: 11px; 
            text-align: left; 
            padding: 1px 3px; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 2px; 
            color: #333;
        }
        .booking-badge { 
            font-size: 11.5px; 
            font-weight: 700;
            padding: 3px 4px; 
            margin-bottom: 2px; 
            border-radius: 3px; 
            color: #fff; 
            display: block; 
            text-decoration: none; 
            white-space: normal;     
            overflow: hidden;     
            text-overflow: ellipsis;  
            max-width: 100%;
            line-height: 1.2;
        }
        .badge-hall { 
            font-size: 11px; 
            font-weight: bold;
            display: block; 
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="calendar-container" id="calendarContainer">
        <div class="calendar-header">
            <h2 id="monthYearDisplay"></h2>
            <div style="display: flex; gap: 5px; width: 100%; margin-top: 5px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="ابحث عن اسم العريس..." style="flex: 1; min-width: 140px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
                <button class="btn-nav" onclick="searchGroom()" style="background: #27ae60;">بحث</button>
            </div>
            <div class="header-buttons">
                <button class="btn-nav" onclick="changeMonth(-1)">الشهر السابق</button>
                <button class="btn-nav" onclick="changeMonth(1)">الشهر التالي</button>
                <button class="btn-nav" onclick="goToToday()" style="background: #27ae60;">اليوم</button>
                <a id="dashboardBtn" href="index.html" class="btn-nav" style="background: #d35400; display: none;" title="لوحة التحكم">لوحة التحكم</a>
                
                <button id="soundToggleBtn" class="btn-nav" onclick="unlockAudioAndNotifications()">🔔 انقر هنا لتفعيل الصوت والإشعارات</button>

                <div class="notification-container" id="notifContainer" style="display: none;">
                    <button class="btn-nav" onclick="toggleNotifications()" style="background: #e67e22;" title="الإشعارات">
                        📬 <span id="notifCount" class="notification-badge-count" style="display: none;">0</span>
                    </button>
                    <div id="notifDropdown" class="notification-dropdown">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 4px;">
                            <span style="font-weight: bold; font-size: 12px;">الإشعارات الواردة</span>
                            <button onclick="clearAllNotifications()" style="background: #e74c3c; color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer;">حذف الكل</button>
                        </div>
                        <div id="notifList" style="max-height: 200px; overflow-y: auto;">
                            <div style="padding: 6px; text-align: center; color: #777; font-size: 11px;">جاري تحميل الإشعارات...</div>
                        </div>
                    </div>
                </div>

                <span id="roleDisplay" class="user-tag">user</span>
                <button class="btn-nav logout" onclick="logout()">خروج</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarDays">
            <div class="day-header">السبت</div>
            <div class="day-header">الأحد</div>
            <div class="day-header">الإثنين</div>
            <div class="day-header">الثلاثاء</div>
            <div class="day-header">الأربعاء</div>
            <div class="day-header">الخميس</div>
            <div class="day-header">الجمعة</div>
        </div>
    </div>

    <!-- نافذة منبثقة فورية للتنبيه داخل التطبيق -->
    <div id="liveAlertModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:20px; border-radius:10px; width:90%; max-width:350px; text-align:center; box-shadow: 0 5px 20px rgba(0,0,0,0.3);">
            <div style="font-size:35px; margin-bottom:10px;">🔔</div>
            <h3 style="color:#c0392b; margin-bottom:10px; font-size:18px;">تنبيه حجز جديد!</h3>
            <p id="liveAlertText" style="color:#333; font-size:13px; margin-bottom:15px; line-height:1.5;"></p>
            <button onclick="closeLiveAlert()" style="background:#27ae60; color:#fff; border:none; padding:8px 20px; border-radius:5px; font-size:13px; font-weight:bold; cursor:pointer; width:100%;">حسناً، فهمت</button>
        </div>
    </div>

    <!-- ملف صوتي جاهز من الإنترنت يعمل مباشرة بدون قيود AudioContext -->
    <audio id="alertAudio" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const SUPABASE_URL = 'https://lgzhmamxyawldbpucxeu.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_V_ZFiFCH2QD2_kLqPY9JBg_ndDdXMJ_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let lastBookingsCount = 0;
        let swRegistration = null;

        // تسجيل ملف sw.js الخاص بالـ PWA مع التأكد من جاهزيته لاستقبال الرسائل
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    swRegistration = reg;
                    console.log('Service Worker registered successfully');
                }).catch(err => {
                    console.log('Service Worker registration failed: ', err);
                });
            });
        }

        const currentUserRole = localStorage.getItem('currentUserRole') || 'user';
        
        if (currentUserRole === 'admin') {
            document.getElementById('roleDisplay').textContent = 'مدير (admin)';
            document.getElementById('dashboardBtn').style.display = 'inline-block'; 
            document.getElementById('notifContainer').style.display = 'inline-block';
            
            // التحقق مما إذا كان المستخدم قد فعل الصوت مسبقاً
            const isSoundAllowed = localStorage.getItem('pwa_sound_allowed');
            if (!isSoundAllowed) {
                document.getElementById('soundToggleBtn').style.display = 'inline-block';
            }
        } else if (currentUserRole === 'read_only') {
            document.getElementById('roleDisplay').textContent = 'قراءة فقط (Read Only)';
        } else {
            document.getElementById('roleDisplay').textContent = 'مستخدم (user)';
        }

        function playBeepSound() {
            try {
                const audio = document.getElementById('alertAudio');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Audio play blocked:", e));
                }
            } catch(e) {
                console.log("Sound error:", e);
            }
        }

        async function unlockAudioAndNotifications() {
            // حفظ حالة التفعيل في ذاكرة المتصفح لكي لا يظهر الزر مرة أخرى بعد التحديث
            localStorage.setItem('pwa_sound_allowed', 'true');
            document.getElementById('soundToggleBtn').style.display = 'none';

            playBeepSound();
            if ('vibrate' in navigator) {
                navigator.vibrate(300);
            }

            if ('Notification' in window) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    alert('تم تفعيل الصوت والإشعارات بنجاح ولن يظهر هذا الزر مرة أخرى!');
                } else {
                    alert('تم تفعيل الصوت بنجاح داخل التطبيق.');
                }
            }
        }

        function triggerNewBookingAlert(title, message) {
            playBeepSound();
            if ('vibrate' in navigator) {
                navigator.vibrate([800, 200, 800, 200, 800]);
            }

            // إرسال إشعار لشريط النظام العلوي عبر Service Worker
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    title: title,
                    body: message
                });
            } else if (swRegistration && swRegistration.active) {
                swRegistration.active.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    title: title,
                    body: message
                });
            }

            if (currentUserRole === 'admin') {
                document.getElementById('liveAlertText').textContent = message || "تمت إضافة حجز عرس جديد إلى النظام.";
                document.getElementById('liveAlertModal').style.display = 'flex';
            }
        }

        function closeLiveAlert() {
            document.getElementById('liveAlertModal').style.display = 'none';
            location.reload();
        }

        const monthNames = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];
        let currentDate = new Date(); 
        let allBookingsMap = {};

        async function initCalendarSystem(isBackgroundCheck = false) {
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('bookings_table').select('*');
                    if (!error && data) {
                        if (isBackgroundCheck && data.length > lastBookingsCount && lastBookingsCount > 0) {
                            if (currentUserRole === 'admin') {
                                triggerNewBookingAlert("حجز عرس جديد!", "تمت إضافة حجز جديد يرجى المراجعة.");
                            }
                        }
                        lastBookingsCount = data.length;

                        allBookingsMap = {};
                        data.forEach(item => {
                            if (!item.booking_date) return;
                            let rawDate = item.booking_date.toString().trim().split('T')[0];
                            let dateParts = rawDate.split('-');
                            let dateKey = rawDate;
                            if (dateParts.length === 3) {
                                const pYear = dateParts[0];
                                const pMonth = String(dateParts[1]).padStart(2, '0');
                                const pDay = String(dateParts[2]).padStart(2, '0');
                                dateKey = `${pYear}-${pMonth}-${pDay}`;
                            }
                            if (!allBookingsMap[dateKey]) allBookingsMap[dateKey] = [];
                            
                            let finalColor = item.box_color || '#27ae60';
                            if (item.status === 'pending' || !item.status) {
                                finalColor = '#95a5a6';
                            }
                            allBookingsMap[dateKey].push({
                                id: item.id,
                                groomName: item.groom_name,
                                hallName: item.hall_name,
                                status: item.status || 'pending',
                                boxColor: finalColor
                            });
                        });
                    }
                }
            } catch (e) {
                console.error('خطأ في جلب الحجوزات:', e);
            }
            renderCalendar();
            
            if (supabaseClient && !window.realtimeInitialized) {
                window.realtimeInitialized = true;
                supabaseClient
                  .channel('public:bookings_table')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings_table' }, payload => {
                      if (payload.eventType === 'INSERT' && currentUserRole === 'admin') {
                          triggerNewBookingAlert("حجز جديد!", "تم إضافة حجز عرس جديد الآن."); 
                      } else {
                          initCalendarSystem(false);
                      }
                  })
                  .subscribe();
            }

            if (currentUserRole === 'admin') {
                fetchNotifications();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const jumpDate = urlParams.get('jumpDate');
            if (jumpDate) {
                window.history.replaceState({}, document.title, window.location.pathname);
                setTimeout(() => {
                    const [bYear, bMonth, bDay] = jumpDate.split('-').map(Number);
                    currentDate = new Date(bYear, bMonth - 1, 1);
                    renderCalendar();
                }, 100);
            }
        }

        setInterval(() => {
            initCalendarSystem(true);
        }, 5000);

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const monthIndex = currentDate.getMonth();
            const monthNumber = monthIndex + 1;
            document.getElementById('monthYearDisplay').innerHTML = `${monthNames[monthIndex]} (${monthNumber}) - ${year}`;
            const daysContainer = document.getElementById('calendarDays');
            daysContainer.innerHTML = `
                <div class="day-header">السبت</div>
                <div class="day-header">الأحد</div>
                <div class="day-header">الإثنين</div>
                <div class="day-header">الثلاثاء</div>
                <div class="day-header">الأربعاء</div>
                <div class="day-header">الخميس</div>
                <div class="day-header">الجمعة</div>
            `;
            const jsDay = new Date(year, monthIndex, 1).getDay();
            const firstDayIndex = (jsDay + 1) % 7; 
            const totalDays = new Date(year, monthIndex + 1, 0).getDate();
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell';
                emptyCell.style.background = '#fcfcfc';
                emptyCell.style.border = 'none';
                emptyCell.onclick = () => openModal('', []);
                daysContainer.appendChild(emptyCell);
            }
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                const fullDatestr = `${year}-${String(monthNumber).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let cellContent = `<div class="day-number">${day}</div>`;
                const dayBookings = allBookingsMap[fullDatestr] || [];
                dayCell.onclick = () => openModal(fullDatestr, dayBookings);
                dayBookings.forEach(booking => {
                    cellContent += `
                        <div class="booking-badge" style="background-color: ${booking.boxColor};" title="${booking.groomName}">
                            <span class="badge-hall"> ${booking.hallName}</span>
                        </div>
                    `;
                });
                dayCell.innerHTML = cellContent;
                daysContainer.appendChild(dayCell);
            }
        }
        function changeMonth(offset) { currentDate.setMonth(currentDate.getMonth() + offset); renderCalendar(); }
        function goToToday() { currentDate = new Date(); renderCalendar(); }
        function logout() { localStorage.clear(); window.location.replace('index.html'); }
        
        let touchStartX = 0, touchEndX = 0;
        const el = document.getElementById('calendarContainer');
        if (el) {
            el.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            el.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 130) changeMonth(1);
                if (touchEndX > touchStartX + 130) changeMonth(-1);
            }, {passive: true});
        }

        function openModal(dateStr, bookings) {
            document.getElementById('modalDateTitle').textContent = dateStr ? `حجوزات يوم: ${dateStr}` : 'إدارة اليوم';
            let listHTML = bookings.length === 0 ? '<p style="text-align:center; color:#777; font-size:12px; padding:10px;">لا توجد حجوزات مسجلة.</p>' : '';
            bookings.forEach(b => {
                let btn = currentUserRole !== 'read_only' ? `<a href="contract.html?date=${dateStr}&id=${b.id}" class="btn-nav" style="padding:4px 8px; font-size:11px; background:#2980b9;">التفاصيل</a>` : '';
                listHTML += `<div style="background:#f9f9f9; border:1px solid #ddd; padding:8px; border-radius:4px; margin-bottom:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;"><div><strong>العريس:</strong> ${b.groomName}<br><span style="color:#555;"><strong>الصالة:</strong> ${b.hallName}</span></div>${btn}</div>`;
            });
            document.getElementById('modalBookingsList').innerHTML = listHTML;
            const addBtn = document.getElementById('modalAddBtn');
            addBtn.style.display = currentUserRole === 'read_only' ? 'none' : 'block';
            addBtn.href = dateStr ? `contract.html?date=${dateStr}` : 'contract.html';
            document.getElementById('bookingModal').style.display = 'flex';
        }

        initCalendarSystem(false);

        async function fetchNotifications() {
            try {
                const { data, error } = await supabaseClient.from('notifications').select('*').order('created_at', { ascending: false }).limit(10);
                if (!error && data) {
                    const unread = data.filter(n => !n.is_read).length;
                    const countSpan = document.getElementById('notifCount');
                    countSpan.textContent = unread;
                    countSpan.style.display = unread > 0 ? 'inline-block' : 'none';
                    
                    document.getElementById('notifList').innerHTML = data.length === 0 ? '<div style="padding: 8px; text-align: center; color: #777; font-size: 11px;">لا توجد إشعارات</div>' : data.map(n => `
                        <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="openNotificationLink(event, ${n.id}, '${n.link}')">
                            <strong>${n.title}</strong>
                            <p style="margin: 2px 0 0 0; color: #555; font-size: 11px;">${n.message}</p>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        function toggleNotifications() {
            const d = document.getElementById('notifDropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }

        async function clearAllNotifications() {
            if (!confirm('حذف جميع الإشعارات؟')) return;
            await supabaseClient.from('notifications').delete().neq('id', 0);
            fetchNotifications();
        }

        async function openNotificationLink(e, id, link) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
            window.location.href = link;
        }

        function normalizeArabicText(t) {
            return !t ? '' : t.toString().toLowerCase().replace(/[\s\-_]/g, '').replace(/[أإآا]/g, 'ا').replace(/[ةه]/g, 'ه').replace(/[ىي]/g, 'ي');
        }

        async function searchGroom() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) { alert('ادخل اسم العريس للبحث.'); return; }
            const { data } = await supabaseClient.from('bookings_table').select('*');
            if (!data || data.length === 0) { alert('لا توجد حجوزات.'); return; }
            const matched = data.filter(i => normalizeArabicText(i.groom_name).includes(normalizeArabicText(query)));
            if (matched.length === 0) { alert('لم يتم العثور على نتائج.'); return; }
            
            document.getElementById('searchCountText').textContent = `تم العثور على (${matched.length}) نتيجة:`;
            document.getElementById('searchSelectionList').innerHTML = matched.map(b => `
                <div onclick='selectAndJump(${JSON.stringify(b)})' style="background:#f9f9f9; border:1px solid #ddd; padding:8px; border-radius:5px; margin-bottom:6px; cursor:pointer;">
                    <p style="margin:0 0 2px 0; font-size:12px;"><strong>العريس:</strong> ${b.groom_name}</p>
                    <p style="margin:0 0 2px 0; font-size:11px; color:#555;"><strong>التاريخ:</strong> ${b.booking_date} | <strong>الصالة:</strong> ${b.hall_name}</p>
                </div>
            `).join('');
            document.getElementById('searchSelectionModal').style.display = 'flex';
        }

        function closeSearchSelectionModal() { document.getElementById('searchSelectionModal').style.display = 'none'; }
        function selectAndJump(b) { closeSearchSelectionModal(); jumpToBookingDate(b); }
        function jumpToBookingDate(b) {
            if (!b.booking_date) return;
            const [y, m, d] = b.booking_date.split('-').map(Number);
            currentDate = new Date(y, m - 1, 1);
            renderCalendar();
        }
    </script>
