<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الحجوزات - نظام تنظيم الأعراس</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #fef2f5; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            padding: 5px; 
            touch-action: pan-y; 
            overflow-x: hidden; 
        }
        .calendar-container { 
            width: 100% !important; 
            max-width: 100% !important; 
            margin: 0 auto;
            background: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            position: relative;
            overflow-x: hidden;
        }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .calendar-header h2 { font-size: 17px; color: #2c3e50; }
        
        .header-buttons { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .btn-nav { background: #3498db; color: white; border: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-nav:hover { background: #2980b9; }
        .logout { background: #e74c3c; }
        .logout:hover { background: #c0392b; }
        
        .user-tag { background: #2c3e50; color: white; padding: 5px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }

        /* تنسيق الإشعارات وجرس التنبيه */
        .notification-container { position: relative; display: inline-block; }
        .notification-badge-count { position: absolute; top: -5px; right: -5px; background: #e74c3c; color: white; border-radius: 50%; padding: 2px 5px; font-size: 9px; font-weight: bold; }
        .notification-dropdown { 
            display: none; 
            position: absolute; 
            left: 0; 
            right: auto; 
            background: #fff; 
            width: 250px; 
            max-width: 85vw; 
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2); 
            z-index: 1200; 
            border-radius: 6px; 
            padding: 8px; 
            text-align: right; 
            border: 1px solid #ddd;
        }
        .notification-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; cursor: pointer; color: #333; word-break: break-word; }
        .notification-item:hover { background: #f1f1f1; }
        .notification-item.unread { font-weight: bold; background: #fdf2e9; }

        /* شبكة التقويم */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, minmax(0, 1fr)); 
            gap: 2px; 
            width: 100%;
        }
        
        .day-header { 
            font-weight: bold; 
            font-size: 10.5px; 
            background: #f8f9fa; 
            padding: 5px 1px; 
            text-align: center; 
            border-radius: 4px;
            color: #2c3e50;
        }
        
        .day-cell { 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            border-radius: 4px; 
            min-height: 85px; 
            display: flex; 
            flex-direction: column; 
            text-align: right; 
            position: relative; 
            padding: 2px; 
            cursor: pointer; 
            overflow: hidden;
        }
        
        .day-number { 
            font-weight: bold; 
            font-size: 11px; 
            text-align: left; 
            padding: 1px 3px; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 2px; 
            color: #333;
        }

        .booking-badge { 
            font-size: 11.5px; 
            font-weight: 700;
            padding: 3px 4px; 
            margin-bottom: 2px; 
            border-radius: 3px; 
            color: #fff; 
            display: block; 
            text-decoration: none; 
            white-space: normal;     
            overflow: hidden;     
            text-overflow: ellipsis;  
            max-width: 100%;
            line-height: 1.2;
        }
        .badge-hall { 
            font-size: 11px; 
            font-weight: bold;
            display: block; 
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="calendar-container" id="calendarContainer">
        <div class="calendar-header">
            <h2 id="monthYearDisplay"></h2>
            
            <!-- حقل وزر البحث الذكي -->
            <div style="display: flex; gap: 5px; width: 100%; margin-top: 5px;">
                <input type="text" id="searchInput" placeholder="ابحث عن اسم العريس..." style="flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
                <button class="btn-nav" onclick="searchGroom()" style="background: #27ae60;">بحث</button>
            </div>

            <div class="header-buttons">
                <!-- أزرار التنقل بين الأشهر -->
                <button class="btn-nav" onclick="changeMonth(-1)">الشهر السابق</button>
                <button class="btn-nav" onclick="changeMonth(1)">الشهر التالي</button>
                <button class="btn-nav" onclick="goToToday()" style="background: #27ae60;">اليوم</button>
                
                <!-- أيقونة الجرس للإشعارات (تظهر فقط للأدمن) -->
                <div class="notification-container" id="notifContainer" style="display: none;">
                    <button class="btn-nav" onclick="toggleNotifications()" style="background: #e67e22;" title="الإشعارات">
                        🔔 <span id="notifCount" class="notification-badge-count" style="display: none;">0</span>
                    </button>
                    <div id="notifDropdown" class="notification-dropdown">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 4px;">
                            <span style="font-weight: bold; font-size: 12px;">الإشعارات الواردة</span>
                            <button onclick="clearAllNotifications()" style="background: #e74c3c; color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer;">حذف الكل</button>
                        </div>
                        <div id="notifList" style="max-height: 200px; overflow-y: auto;">
                            <div style="padding: 6px; text-align: center; color: #777; font-size: 11px;">جاري تحميل الإشعارات...</div>
                        </div>
                    </div>
                </div>

                <span id="roleDisplay" class="user-tag">user</span>
                <button class="btn-nav logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarDays">
            <div class="day-header">السبت</div>
            <div class="day-header">الأحد</div>
            <div class="day-header">الإثنين</div>
            <div class="day-header">الثلاثاء</div>
            <div class="day-header">الأربعاء</div>
            <div class="day-header">الخميس</div>
            <div class="day-header">الجمعة</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lgzhmamxyawldbpucxeu.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_V_ZFiFCH2QD2_kLqPY9JBg_ndDdXMJ_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const monthNames = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        let currentDate = new Date(); 
        const currentUserRole = localStorage.getItem('currentUserRole') || 'user';
        
        // عرض نوع الصلاحية الحالي
        if (currentUserRole === 'admin') {
            document.getElementById('roleDisplay').textContent = 'مدير (admin)';
        } else if (currentUserRole === 'read_only') {
            document.getElementById('roleDisplay').textContent = 'قراءة فقط (Read Only)';
        } else {
            document.getElementById('roleDisplay').textContent = 'مستخدم (user)';
        }

        // إظهار حاوية الإشعارات للأدمن فقط
        if (currentUserRole === 'admin') {
            document.getElementById('notifContainer').style.display = 'inline-block';
        }

        let allBookingsMap = {};

        async function initCalendarSystem() {
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('bookings_table').select('*');
                    if (!error && data) {
                        allBookingsMap = {};
                        data.forEach(item => {
                            if (!item.booking_date) return;
                            
                            // توحيد وصياغة التاريخ بدقة لضمان المطابقة مع التقويم (يزيل الأوقات ويضمن وجود الأصفار القياسية)
                            let rawDate = item.booking_date.toString().trim().split('T')[0];
                            let dateParts = rawDate.split('-');
                            let dateKey = rawDate;
                            if (dateParts.length === 3) {
                                const pYear = dateParts[0];
                                const pMonth = String(dateParts[1]).padStart(2, '0');
                                const pDay = String(dateParts[2]).padStart(2, '0');
                                dateKey = `${pYear}-${pMonth}-${pDay}`;
                            }

                            if (!allBookingsMap[dateKey]) allBookingsMap[dateKey] = [];
                            
                            let finalColor = item.box_color || '#27ae60';
                            if (item.status === 'pending' || !item.status) {
                                finalColor = '#95a5a6';
                            }

                            allBookingsMap[dateKey].push({
                                id: item.id,
                                groomName: item.groom_name,
                                hallName: item.hall_name,
                                status: item.status || 'pending',
                                boxColor: finalColor
                            });
                        });
                    }
                }
            } catch (e) {
                console.error('خطأ في جلب الحجوزات:', e);
            }
            renderCalendar();

            if (currentUserRole === 'admin') {
                fetchNotifications();
                if (supabaseClient) {
                    supabaseClient
                      .channel('public:notifications')
                      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, payload => {
                          fetchNotifications();
                      })
                      .subscribe();
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const jumpDate = urlParams.get('jumpDate');
            
            if (jumpDate) {
                window.history.replaceState({}, document.title, window.location.pathname);

                setTimeout(() => {
                    const [bYear, bMonth, bDay] = jumpDate.split('-').map(Number);
                    currentDate = new Date(bYear, bMonth - 1, 1);
                    renderCalendar();

                    setTimeout(() => {
                        const cells = document.querySelectorAll('.day-cell');
                        cells.forEach(cell => {
                            const dayNumElem = cell.querySelector('.day-number');
                            if (dayNumElem && parseInt(dayNumElem.textContent) === bDay) {
                                cell.style.transition = 'all 0.5s ease';
                                cell.style.border = '2px solid #e74c3c';
                                cell.style.backgroundColor = '#fadbd8';
                                
                                setTimeout(() => {
                                    cell.style.border = '1px solid #e0e0e0';
                                    cell.style.backgroundColor = '#fafafa';
                                }, 3500);
                            }
                        });
                    }, 150);
                }, 100);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const monthIndex = currentDate.getMonth();
            const monthNumber = monthIndex + 1;

            const headerText = `${monthNames[monthIndex]} (${monthNumber}) - ${year}`;
            document.getElementById('monthYearDisplay').innerHTML = headerText;

            const daysContainer = document.getElementById('calendarDays');
            
            const headersHTML = `
                <div class="day-header">السبت</div>
                <div class="day-header">الأحد</div>
                <div class="day-header">الإثنين</div>
                <div class="day-header">الثلاثاء</div>
                <div class="day-header">الأربعاء</div>
                <div class="day-header">الخميس</div>
                <div class="day-header">الجمعة</div>
            `;
            daysContainer.innerHTML = headersHTML;

            const jsDay = new Date(year, monthIndex, 1).getDay();
            const firstDayIndex = (jsDay + 1) % 7; 
            const totalDays = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell';
                emptyCell.style.background = '#fcfcfc';
                emptyCell.style.border = 'none';
                emptyCell.style.cursor = 'pointer';
                emptyCell.onclick = () => openModal('', []);
                daysContainer.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';

                const formattedMonth = String(monthNumber).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const fullDatestr = `${year}-${formattedMonth}-${formattedDay}`;

                let cellContent = `<div class="day-number">${day}</div>`;
                const dayBookings = allBookingsMap[fullDatestr] && allBookingsMap[fullDatestr].length > 0 ? allBookingsMap[fullDatestr] : [];

                dayCell.onclick = () => openModal(fullDatestr, dayBookings);

                if (dayBookings.length > 0) {
                    dayBookings.forEach(booking => {
                        const customBgColor = booking.boxColor || '#27ae60';
                        cellContent += `
                            <div class="booking-badge" style="background-color: ${customBgColor};" title="${booking.groomName}">
                                <span class="badge-hall"> ${booking.hallName}</span>
                            </div>
                        `;
                    });
                }
                
                dayCell.innerHTML = cellContent;
                daysContainer.appendChild(dayCell);
            }
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date(); 
            renderCalendar();
        }

        function logout() {
            localStorage.removeItem('currentUserRole');
            localStorage.removeItem('currentUsername');
            window.location.replace('index.html');
        }

        let touchStartX = 0;
        let touchEndX = 0;

        const calendarContainerEl = document.getElementById('calendarContainer');
        calendarContainerEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        calendarContainerEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, { passive: true });

        function handleSwipeGesture() {
            const threshold = 130; 
            if (touchEndX < touchStartX - threshold) {
                changeMonth(1);
            }
            if (touchEndX > touchStartX + threshold) {
                changeMonth(-1);
            }
        }

        function openModal(dateStr, bookings) {
            document.getElementById('modalDateTitle').textContent = dateStr ? `حجوزات يوم: ${dateStr}` : 'إدارة اليوم';
            let listHTML = '';
            if (bookings.length === 0) {
                listHTML = '<p style="text-align:center; color:#777; font-size:12px; padding:10px;">لا توجد حجوزات مسجلة في هذا اليوم.</p>';
            } else {
                bookings.forEach(b => {
                    let detailsButtonHTML = '';
                    if (currentUserRole !== 'read_only') {
                        detailsButtonHTML = `<a href="contract.html?date=${dateStr}&id=${b.id}" class="btn-nav" style="padding:4px 8px; font-size:11px; text-decoration:none; background:#2980b9;">عرض التفاصيل</a>`;
                    }

                    listHTML += `
                        <div style="background:#f9f9f9; border:1px solid #ddd; padding:8px; border-radius:4px; margin-bottom:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong>العريس:</strong> ${b.groomName}<br>
                                <span style="color:#555;"><strong>الصالة:</strong> ${b.hallName}</span>
                            </div>
                            ${detailsButtonHTML}
                        </div>
                    `;
                });
            }
            document.getElementById('modalBookingsList').innerHTML = listHTML;

            const addBtnElement = document.getElementById('modalAddBtn');
            if (currentUserRole === 'read_only') {
                addBtnElement.style.display = 'none';
            } else {
                addBtnElement.style.display = 'block';
                addBtnElement.href = dateStr ? `contract.html?date=${dateStr}` : 'contract.html';
            }

            document.getElementById('bookingModal').style.display = 'flex';
        }

        initCalendarSystem();

        async function fetchNotifications() {
            try {
                const { data, error } = await supabaseClient
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);

                if (!error && data) {
                    const unreadCount = data.filter(n => !n.is_read).length;
                    const countSpan = document.getElementById('notifCount');
                    
                    if (unreadCount > 0) {
                        countSpan.textContent = unreadCount;
                        countSpan.style.display = 'inline-block';
                    } else {
                        countSpan.style.display = 'none';
                    }

                    let listHTML = '';
                    if (data.length === 0) {
                        listHTML = '<div style="padding: 8px; text-align: center; color: #777; font-size: 11px;">لا توجد إشعارات</div>';
                    } else {
                        data.forEach(n => {
                            const unreadClass = n.is_read ? '' : 'unread';
                            listHTML += `
                                <div class="notification-item ${unreadClass}" onclick="openNotificationLink(event, ${n.id}, '${n.link}')">
                                    <strong>${n.title}</strong>
                                    <p style="margin: 2px 0 0 0; color: #555; font-size: 11px;">${n.message}</p>
                                </div>
                            `;
                        });
                    }
                    document.getElementById('notifList').innerHTML = listHTML;
                }
            } catch (e) {
                console.error('خطأ في جلب الإشعارات:', e);
            }
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        async function clearAllNotifications() {
            if (!confirm('هل أنت متأكد من حذف جميع الإشعارات؟')) return;

            try {
                const { error } = await supabaseClient
                    .from('notifications')
                    .delete()
                    .neq('id', 0);

                if (error) throw error;
                fetchNotifications();
            } catch (e) {
                console.error('خطأ أثناء حذف الإشعارات:', e);
                alert('حدث خطأ أثناء مسح الإشعارات.');
            }
        }

        async function openNotificationLink(event, notificationId, link) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            try {
                await supabaseClient
                    .from('notifications')
                    .update({ is_read: true })
                    .eq('id', notificationId);
                window.location.href = link;
            } catch (e) {
                window.location.href = link;
            }
        }

        function normalizeArabicText(text) {
            if (!text) return '';
            return text
                .toString()
                .toLowerCase()
                .replace(/[\s\-_]/g, '')
                .replace(/[أإآا]/g, 'ا')
                .replace(/[ةه]/g, 'ه')
                .replace(/[ىي]/g, 'ي');
        }

        async function searchGroom() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) {
                alert('الرجاء إدخال اسم العريس للبحث.');
                return;
            }

            const cleanQuery = normalizeArabicText(rawQuery);

            try {
                const { data, error } = await supabaseClient.from('bookings_table').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    alert('لا توجد حجوزات مسجلة حالياً.');
                    return;
                }

                const matchedBookings = data.filter(item => {
                    const cleanGroomName = normalizeArabicText(item.groom_name);
                    return cleanGroomName.includes(cleanQuery);
                });

                if (matchedBookings.length === 0) {
                    alert('لم يتم العثور على أي حجز مطابق أو قريب من هذا الاسم.');
                    return;
                }

                showSearchSelectionModal(matchedBookings);

            } catch (e) {
                console.error('خطأ أثناء البحث:', e);
                alert('حدث خطأ أثناء الاتصال بقاعدة البيانات للبحث.');
            }
        }

        function showSearchSelectionModal(bookings) {
            document.getElementById('searchCountText').textContent = `تم العثور على (${bookings.length}) نتيجة مطابقة. اختر الحجز المطلوب:`;
            
            let listHTML = '';
            bookings.forEach((b) => {
                const badgeColor = b.box_color || b.boxColor || '#27ae60';
                const bookingObjStr = JSON.stringify({
                    booking_date: b.booking_date,
                    groom_name: b.groom_name,
                    hall_name: b.hall_name
                }).replace(/"/g, '&quot;');

                listHTML += `
                    <div onclick='selectAndJump(${bookingObjStr})' style="background:#f9f9f9; border:1px solid #ddd; padding:8px; border-radius:5px; margin-bottom:6px; cursor:pointer;">
                        <p style="margin:0 0 2px 0; font-size:12px;"><strong>العريس:</strong> ${b.groom_name}</p>
                        <p style="margin:0 0 2px 0; font-size:11px; color:#555;"><strong>التاريخ:</strong> ${b.booking_date} | <strong>الصالة:</strong> ${b.hall_name}</p>
                        <span style="display:inline-block; background:${badgeColor}; color:#fff; padding:2px 5px; border-radius:3px; font-size:10px; margin-top:3px;">انتقال للحجز</span>
                    </div>
                `;
            });

            document.getElementById('searchSelectionList').innerHTML = listHTML;
            document.getElementById('searchSelectionModal').style.display = 'flex';
        }

        function closeSearchSelectionModal() {
            document.getElementById('searchSelectionModal').style.display = 'none';
        }

        function selectAndJump(booking) {
            closeSearchSelectionModal();
            jumpToBookingDate(booking);
        }

        function jumpToBookingDate(booking) {
            const bookingDateStr = booking.booking_date; 
            if (!bookingDateStr) return;

            const [bYear, bMonth, bDay] = bookingDateStr.split('-').map(Number);
            currentDate = new Date(bYear, bMonth - 1, 1);
            renderCalendar();

            setTimeout(() => {
                const cells = document.querySelectorAll('.day-cell');
                cells.forEach(cell => {
                    const dayNumElem = cell.querySelector('.day-number');
                    if (dayNumElem && parseInt(dayNumElem.textContent) === bDay) {
                        cell.style.transition = 'all 0.5s ease';
                        cell.style.border = '2px solid #e74c3c';
                        cell.style.backgroundColor = '#fadbd8';
                        
                        setTimeout(() => {
                            cell.style.border = '1px solid #e0e0e0';
                            cell.style.backgroundColor = '#fafafa';
                        }, 3000);
                    }
                });
            }, 100);
        }
    </script>

    <!-- القائمة المنبثقة للتفاصيل اليومية -->
    <div id="bookingModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:15px; border-radius:8px; width:90%; max-width:380px; text-align:right; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
            <h3 id="modalDateTitle" style="margin-bottom:12px; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:6px; font-size:15px;"></h3>
            <div id="modalBookingsList" style="max-height:220px; overflow-y:auto; margin-bottom:12px;"></div>
            <div style="display:flex; gap:8px; justify-content:space-between;">
                <a id="modalAddBtn" href="#" class="btn-nav" style="text-align:center; flex:1; text-decoration:none; background:#27ae60;">+ إضافة عقد جديد</a>
                <button onclick="document.getElementById('bookingModal').style.display = 'none'" class="btn-nav logout" style="cursor:pointer;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- قائمة منبثقة لاختيار النتائج عند البحث -->
    <div id="searchSelectionModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1100; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:15px; border-radius:8px; width:90%; max-width:380px; text-align:right; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom:8px; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:6px; font-size:15px;">نتائج البحث</h3>
            <p id="searchCountText" style="font-size:12px; color:#555; margin-bottom:8px;"></p>
            <div id="searchSelectionList" style="max-height:220px; overflow-y:auto; margin-bottom:12px;"></div>
            <div style="display:flex; justify-content:flex-end;">
                <button onclick="closeSearchSelectionModal()" class="btn-nav logout" style="cursor:pointer; padding:5px 10px; font-size:11px;">إغلاق</button>
            </div>
        </div>
    </div>
</body>
</html>
